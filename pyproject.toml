[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wu088-hh"
version = "0.1.0"
description = "Source-bound H-H computation, performance diagnostics and guarded optimization candidates"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
